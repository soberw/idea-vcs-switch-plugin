name: Publish Plugin

on:
  workflow_dispatch:
    inputs:
      pluginChannel:
        description: "Marketplace publish channel"
        required: false
        default: "default"
        type: string
      pluginHidden:
        description: "Publish as hidden release"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate tag matches plugin version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(grep '^version = ' gradle.properties | sed 's/^version = //')"
          if [[ "$TAG_VERSION" != "$FILE_VERSION" ]]; then
            echo "Tag version ($TAG_VERSION) does not match gradle.properties version ($FILE_VERSION)."
            exit 1
          fi

      - name: Build plugin
        run: ./gradlew buildPlugin --console=plain

      - name: Verify plugin
        run: ./gradlew verifyPlugin --console=plain

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: vcs-switch-plugin
          path: build/distributions/*.zip
          if-no-files-found: error

      - name: Publish plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          PLUGIN_CHANNEL: ${{ github.event.inputs.pluginChannel || 'default' }}
          PLUGIN_HIDDEN: ${{ github.event.inputs.pluginHidden || 'false' }}
        run: ./gradlew publishPlugin --console=plain -PpluginChannel=$PLUGIN_CHANNEL -PpluginHidden=$PLUGIN_HIDDEN
